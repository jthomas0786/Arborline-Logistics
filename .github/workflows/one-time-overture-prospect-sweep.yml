name: One-time Overture Prospect Sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-overture-prospect-sweep.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-overture-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Discover net-new Overture prospects now
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overture client
        run: python -m pip install --disable-pip-version-check --no-input overturemaps

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then separator="?"; fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-overture")"
          token="$(printf '%s' "${response}" | jq -r '.value')"
          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Discover core public-service companies
        env:
          ARBORLINE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          slot_index="$(( $(date -u +%s) / 21600 ))"
          echo "Immediate core discovery slot ${slot_index}"
          python scripts/connect_overture_discovery.py --day-index "${slot_index}"

      - name: Discover active Tier-1 expansion metros
        env:
          ARBORLINE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          slot_index="$(( $(date -u +%s) / 21600 ))"
          echo "Immediate Tier-1 discovery slot ${slot_index}"
          python scripts/connect_overture_tier1_expansion.py --day-index "${slot_index}"

# Restored mature prospect filters; this run verifies the source-only Supabase ingestion path end to end.
