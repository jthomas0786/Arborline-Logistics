name: Apply crawler affiliation scope v5c

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch_crawler_affiliation_scope_v5c.py"
      - ".github/workflows/one-time-crawler-affiliation-scope-v5c.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/patch_crawler_affiliation_scope_v5c.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate safety invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'crawler-prose-identity-qc-v5c' package.json
          grep -q 'affiliationWindow' lib/connect-public-research.ts
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'mailboxPromotionRequiresExistingVerifier' app/api/cron/connect-deep-research/route.ts
          grep -q 'messagesSent: 0' app/api/cron/connect-deep-research/route.ts
      - name: Commit verified v5c changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/connect-public-research.ts package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts package.json
          git commit -m "Scope executive affiliation checks to title context"
          git push origin HEAD:main
