name: One-time Connect multi-contact retention

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-connect-multi-contact-retention.yml"
      - ".github/scripts/patch_connect_multi_contact_retention.py"
      - ".github/scripts/check_connect_multi_contact_retention.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded multi-contact patch
        run: python .github/scripts/patch_connect_multi_contact_retention.py
      - run: npm install --no-audit --no-fund
      - name: Run multi-contact retention regressions
        run: npx --yes tsx@4.20.6 .github/scripts/check_connect_multi_contact_retention.ts
      - name: Preserve canonical-recipient regression
        run: npx --yes tsx@4.20.6 .github/scripts/check_connect_single_recipient.ts
      - name: Preserve geography regression
        run: npx --yes tsx@4.20.6 .github/scripts/check_connect_geo_targeting.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve strict research and outreach safety gates
        run: |
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'strictPublishedObservationForName' lib/connect-public-research.ts
          grep -q 'acceptedStrictBindings' lib/connect-public-research.ts
          grep -q 'mailbox_verified: false' lib/connect-public-research.ts
          grep -q "approved_by_user_id IS NOT NULL" lib/connect-outreach-send.ts
          grep -q "prior.status IN ('SENT','DELIVERED')" lib/connect-outreach-send.ts
      - name: Commit validated runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts lib/connect-deep-research-workers.ts
          git diff --cached --check
          git commit -m "Retain multiple researched decision makers per prospect"
          git push origin HEAD:main
