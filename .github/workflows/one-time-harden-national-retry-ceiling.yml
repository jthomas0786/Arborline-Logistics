name: One-time harden national retry ceiling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-harden-national-retry-ceiling.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce retry ceiling for stale national jobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/connect-national-worker-fleet.ts")
          text = path.read_text()

          old = '''async function recoverStaleNationalJobs() {
  await getPool().query(
    `WITH recovered AS (
       UPDATE connect_worker_jobs
       SET status='RETRY',run_at=now(),locked_at=NULL,locked_by=NULL,heartbeat_at=NULL,
           last_error='Recovered after stale national worker lock.',updated_at=now()
       WHERE worker_type IN ('COORDINATE','RESEARCH','NATIVE_ENRICH','PROVIDER_ENRICH')
         AND status='RUNNING' AND locked_at < now() - interval '15 minutes'
       RETURNING id,attempts
     )
     UPDATE connect_worker_runs r
     SET status='RETRY',
         error_message=coalesce(r.error_message,'Recovered after stale national worker lock.'),
         completed_at=coalesce(r.completed_at,now())
     FROM recovered
     WHERE r.job_id=recovered.id
       AND r.status='RUNNING'
       AND r.attempt<=recovered.attempts`
  );
}'''
          new = '''async function recoverStaleNationalJobs() {
  await getPool().query(
    `WITH recovered AS (
       UPDATE connect_worker_jobs
       SET status=CASE WHEN attempts >= max_attempts THEN 'FAILED' ELSE 'RETRY' END,
           run_at=CASE WHEN attempts >= max_attempts THEN run_at ELSE now() END,
           completed_at=CASE WHEN attempts >= max_attempts THEN coalesce(completed_at,now()) ELSE NULL END,
           locked_at=NULL,locked_by=NULL,heartbeat_at=NULL,
           last_error=CASE
             WHEN attempts >= max_attempts THEN 'National worker exhausted retry ceiling after stale lock.'
             ELSE 'Recovered after stale national worker lock.'
           END,
           updated_at=now()
       WHERE worker_type IN ('COORDINATE','RESEARCH','NATIVE_ENRICH','PROVIDER_ENRICH')
         AND status='RUNNING' AND locked_at < now() - interval '15 minutes'
       RETURNING id,attempts,status
     )
     UPDATE connect_worker_runs r
     SET status=recovered.status,
         error_message=coalesce(r.error_message,
           CASE WHEN recovered.status='FAILED'
             THEN 'National worker exhausted retry ceiling after stale lock.'
             ELSE 'Recovered after stale national worker lock.'
           END),
         completed_at=coalesce(r.completed_at,now())
     FROM recovered
     WHERE r.job_id=recovered.id
       AND r.status='RUNNING'
       AND r.attempt<=recovered.attempts`
  );
}'''
          if text.count(old) != 1:
              raise SystemExit(f"stale recovery block: expected exactly 1 match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_claim = "AND status IN ('QUEUED','RETRY') AND run_at<=now()"
          new_claim = "AND status IN ('QUEUED','RETRY') AND run_at<=now()\n         AND attempts < max_attempts"
          if text.count(old_claim) != 1:
              raise SystemExit(f"claim retry ceiling: expected exactly 1 match, found {text.count(old_claim)}")
          text = text.replace(old_claim, new_claim, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- lib/connect-national-worker-fleet.ts

      - name: Commit retry ceiling hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-national-worker-fleet.ts
          git commit -m "Enforce national research retry ceiling"
          git push origin HEAD:main
