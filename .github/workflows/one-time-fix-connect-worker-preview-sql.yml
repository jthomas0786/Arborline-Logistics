name: One-time Connect worker preview SQL repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-connect-worker-preview-sql.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Repair legacy preview SQL parameters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/connect-workers.ts")
          s = p.read_text()
          predicate_old = "AND (($3::uuid IS NULL AND segment_id IS NULL) OR segment_id=$3)"
          predicate_new = "AND (($2::uuid IS NULL AND segment_id IS NULL) OR segment_id=$2)"
          if s.count(predicate_old) != 2:
              raise SystemExit(f"expected 2 legacy preview predicates, found {s.count(predicate_old)}")
          s = s.replace(predicate_old, predicate_new)
          for fn in ("previewEnrichment", "previewQualification"):
              start = s.index(f"async function {fn}")
              end = s.index("\n}\n", start) + 3
              block = s[start:end]
              old_params = "[clientId, limit, segmentId]"
              if block.count(old_params) != 1:
                  raise SystemExit(f"{fn}: expected one legacy parameter array")
              block = block.replace(old_params, "[clientId, segmentId]")
              s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path("lib/connect-workers.ts").read_text()
          for fn in ("previewEnrichment", "previewQualification"):
              start = s.index(f"async function {fn}")
              end = s.index("\n}\n", start) + 3
              block = s[start:end]
              assert "$2::uuid" in block
              assert "$3::uuid" not in block
              assert "[clientId, segmentId]" in block
          print("worker preview SQL parameter check passed")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Publish validated runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-workers.ts
          git diff --cached --check
          git commit -m "Fix Connect worker preview SQL parameters"
          git push origin HEAD:main
