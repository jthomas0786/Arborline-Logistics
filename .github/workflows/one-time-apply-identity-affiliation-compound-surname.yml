name: One-time apply identity affiliation and compound surname hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-apply-identity-affiliation-compound-surname.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply parser hardening
        run: python .github/scripts/patch_identity_affiliation_compound_surname.py
      - name: Validate source
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          git diff --check
      - name: Commit source hardening
        run: |
          git config user.name "jthomas0786"
          git config user.email "jthomas0786@gmail.com"
          git add lib/connect-public-research.ts lib/connect-native-enrichment.ts
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Harden external affiliations and compound surnames"
          git push origin HEAD:main
