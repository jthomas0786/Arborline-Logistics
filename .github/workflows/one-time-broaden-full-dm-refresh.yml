name: One-time broaden full decision maker refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-broaden-full-dm-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Broaden refresh-only selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/connect-deep-research-workers.ts')
          text = path.read_text()
          old = '''       AND (\n         p.qualification_status='QUALIFIED'\n         OR (p.qualification_status='REVIEW' AND coalesce(p.qualification_score,0)>=60)\n       )\n       AND (p.source<>'ARBORLINE_DISCOVERY' OR p.source_metadata->'service_fit'->>'status'='MATCH')\n       AND (\n         (\n           $2::text='dm'\n           AND nullif(p.source_metadata->'decision_maker_refresh'->>'requested_at','') IS NOT NULL\n           AND (\n             nullif(p.source_metadata->'deep_decision_maker_research'->>'checked_at','') IS NULL\n             OR (p.source_metadata->'deep_decision_maker_research'->>'checked_at')::timestamptz\n                < (p.source_metadata->'decision_maker_refresh'->>'requested_at')::timestamptz\n           )\n         )\n         OR (\n           p.suppression_status='CLEAR'\n           AND p.contact_email IS NULL\n           AND (\n             ($2::text='dm' AND (\n               coalesce(p.source_metadata->$3->>'checked_at','')=''\n               OR (p.source_metadata->$3->>'checked_at')::timestamptz <= now()-interval '${RECHECK_DAYS} days'\n             ))\n             OR ($2::text='email'\n               AND p.contact_name IS NOT NULL\n               AND p.contact_title IS NOT NULL\n               AND (\n                 coalesce(p.source_metadata->$3->>'checked_at','')=''\n                 OR (p.source_metadata->$3->>'checked_at')::timestamptz <= now()-interval '${RECHECK_DAYS} days'\n               )\n             )\n           )\n         )\n       )'''
          new = '''       AND (\n         (\n           $2::text='dm'\n           AND nullif(p.source_metadata->'decision_maker_refresh'->>'requested_at','') IS NOT NULL\n           AND (\n             nullif(p.source_metadata->'deep_decision_maker_research'->>'checked_at','') IS NULL\n             OR (p.source_metadata->'deep_decision_maker_research'->>'checked_at')::timestamptz\n                < (p.source_metadata->'decision_maker_refresh'->>'requested_at')::timestamptz\n           )\n         )\n         OR (\n           p.suppression_status='CLEAR'\n           AND p.contact_email IS NULL\n           AND (\n             p.qualification_status='QUALIFIED'\n             OR (p.qualification_status='REVIEW' AND coalesce(p.qualification_score,0)>=60)\n           )\n           AND (p.source<>'ARBORLINE_DISCOVERY' OR p.source_metadata->'service_fit'->>'status'='MATCH')\n           AND (\n             ($2::text='dm' AND (\n               coalesce(p.source_metadata->$3->>'checked_at','')=''\n               OR (p.source_metadata->$3->>'checked_at')::timestamptz <= now()-interval '${RECHECK_DAYS} days'\n             ))\n             OR ($2::text='email'\n               AND p.contact_name IS NOT NULL\n               AND p.contact_title IS NOT NULL\n               AND (\n                 coalesce(p.source_metadata->$3->>'checked_at','')=''\n                 OR (p.source_metadata->$3->>'checked_at')::timestamptz <= now()-interval '${RECHECK_DAYS} days'\n               )\n             )\n           )\n         )\n       )'''
          if text.count(old) != 1:
              raise SystemExit('refresh selector anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate refresh-only broadening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
          python - <<'PY'
          from pathlib import Path
          text = Path('lib/connect-deep-research-workers.ts').read_text()
          refresh = "nullif(p.source_metadata->'decision_maker_refresh'->>'requested_at','') IS NOT NULL"
          if text.count(refresh) < 2:
              raise SystemExit('refresh marker missing')
          if "existing_contact_preserved" not in text or "!preserveExistingIdentity" not in text:
              raise SystemExit('existing-contact preservation invariant missing')
          PY
      - name: Commit broadened refresh
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-broaden-full-dm-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Research every domain-backed prospect on refresh"
          git pull --rebase origin main
          git push origin HEAD:main
