name: One-time harden benchmark research eligibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-harden-benchmark-eligibility.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Exclude rejected and suppressed prospects from benchmark deep research
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/connect-national-worker-fleet.ts")
          text = path.read_text()
          marker = "AND coalesce(p.source_metadata->>'research_benchmark_version','') <> '2'"
          if text.count(marker) != 2:
              raise SystemExit(f"expected 2 benchmark eligibility markers, found {text.count(marker)}")
          replacement = marker + "\n           AND coalesce(p.qualification_status,'REVIEW') NOT IN ('REJECTED','SUPPRESSED')\n           AND coalesce(p.suppression_status,'CLEAR')='CLEAR'"
          text = text.replace(marker, replacement)
          path.write_text(text)
          PY

          git diff --check
          git diff -- lib/connect-national-worker-fleet.ts

      - name: Commit benchmark eligibility hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-national-worker-fleet.ts
          git commit -m "Skip rejected prospects in benchmark research"
          git push origin HEAD:main
