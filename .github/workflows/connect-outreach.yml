name: ArborLine 9 AM Outreach

on:
  schedule:
    # 09:07 America/Chicago: 14:07 UTC during CDT, 15:07 UTC during CST.
    # The API route checks America/Chicago and only dispatches during local hour 9.
    - cron: "7 14 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send currently approved/queued outreach now"
        required: false
        default: false
        type: boolean
  # One-time trigger used for the explicitly approved manual dispatch below.
  # This push hook is removed immediately after the run is verified.
  push:
    branches: [main]
    paths:
      - ".github/workflows/connect-outreach.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-9am-outreach
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch approved outreach
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANUAL_SEND: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_now) }}
    steps:
      - name: Request GitHub OIDC token and run outreach sender
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-outreach")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          calls=1
          if [[ "${MANUAL_SEND}" == "true" ]]; then
            # The production sender has a deliberate per-invocation cap. Two
            # replay-safe calls allow an explicitly approved queue larger than
            # that cap to drain while preserving the daily limit and all gates.
            calls=2
          fi

          for call in $(seq 1 "${calls}"); do
            invocation_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${call}"
            extra_headers=()
            if [[ "${MANUAL_SEND}" == "true" ]]; then
              extra_headers+=( -H "X-ArborLine-Manual-Send: true" )
            fi

            curl --fail-with-body --silent --show-error --max-time 120 \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "User-Agent: ArborLine-GitHub-Outreach/1.0" \
              -H "X-ArborLine-Invocation-Id: ${invocation_id}" \
              "${extra_headers[@]}" \
              "https://www.arborlineconnect.com/api/cron/connect-outreach"
            echo
          done
