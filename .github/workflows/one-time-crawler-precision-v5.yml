name: Apply crawler precision v5

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch_crawler_precision_v5.py"
      - ".github/workflows/one-time-crawler-precision-v5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/patch_crawler_precision_v5.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate crawler safety invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'crawler-prose-identity-qc-v5' package.json
          grep -q 'EXPLICIT_FAMILY_RELATIONSHIP' lib/connect-public-research.ts
          grep -q 'HTTP_4XX' lib/connect-public-research.ts
          grep -q 'mailboxPromotionRequiresExistingVerifier' app/api/cron/connect-deep-research/route.ts
          grep -q 'messagesSent: 0' app/api/cron/connect-deep-research/route.ts
      - name: Commit verified crawler precision changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/connect-public-research.ts package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts package.json
          git commit -m "Improve crawler prose identity resolution"
          git push origin HEAD:main
