name: One-time isolate decision maker refresh state

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-refresh-state-isolation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolate refresh state from legacy checked timestamps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('lib/connect-deep-research-workers.ts')
          text=path.read_text()
          pattern = re.compile(r"nullif\(p\.source_metadata->'decision_maker_refresh'->>'requested_at',''\) IS NOT NULL\s+AND \(\s+nullif\(p\.source_metadata->'deep_decision_maker_research'->>'checked_at',''\) IS NULL\s+OR \(p\.source_metadata->'deep_decision_maker_research'->>'checked_at'\)::timestamptz\s+< \(p\.source_metadata->'decision_maker_refresh'->>'requested_at'\)::timestamptz\s+\)")
          replacement = "nullif(p.source_metadata->'decision_maker_refresh'->>'requested_at','') IS NOT NULL\n                  AND coalesce(p.source_metadata->'decision_maker_refresh'->>'status','PENDING')='PENDING'"
          text, count = pattern.subn(replacement, text)
          if count != 2:
              raise SystemExit(f'expected 2 refresh timestamp gates, found {count}')
          path.write_text(text)
          PY
      - name: Validate isolated refresh state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
          python - <<'PY'
          from pathlib import Path
          text=Path('lib/connect-deep-research-workers.ts').read_text()
          if text.count("decision_maker_refresh'->>'status','PENDING')='PENDING'") != 2:
              raise SystemExit('isolated PENDING selector missing')
          if 'status: "COMPLETED"' not in text:
              raise SystemExit('refresh completion marker missing')
          if 'existing_contact_preserved' not in text:
              raise SystemExit('contact preservation invariant missing')
          PY
      - name: Commit refresh state isolation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-refresh-state-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate full refresh from legacy worker timestamps"
          git pull --rebase origin main
          git push origin HEAD:main
