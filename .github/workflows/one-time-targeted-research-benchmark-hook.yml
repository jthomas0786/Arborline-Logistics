name: Apply targeted research benchmark hook

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch_targeted_research_benchmark.py"
      - ".github/workflows/one-time-targeted-research-benchmark-hook.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python .github/scripts/patch_targeted_research_benchmark.py
      - run: npm ci
      - run: npm run typecheck
      - run: git diff --check
      - name: Validate benchmark safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prospectId' app/api/cron/connect-deep-research/route.ts
          grep -q 'benchmark-prospect-id.txt' .github/workflows/connect-deep-research.yml
          grep -q 'providerCallsMade == 0' .github/workflows/connect-deep-research.yml
          grep -q 'messagesSent == 0' .github/workflows/connect-deep-research.yml
          grep -q 'outreachApprovalsCreated == 0' .github/workflows/connect-deep-research.yml
      - name: Commit verified benchmark source hook
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/connect-deep-research-workers.ts app/api/cron/connect-deep-research/route.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-deep-research-workers.ts app/api/cron/connect-deep-research/route.ts
          git commit -m "Add protected targeted research benchmark source"
          git push origin HEAD:main
