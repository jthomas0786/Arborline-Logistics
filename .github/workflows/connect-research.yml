name: ArborLine Research Queue

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-research-queue
  cancel-in-progress: false

jobs:
  research:
    name: Research prospect backlog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token and run research queue
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-research")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 240 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "User-Agent: ArborLine-GitHub-Research/1.0" \
            "https://www.arborlineconnect.com/api/cron/connect-research"
          echo
