name: ArborLine Research Queue

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connect-research.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-research-queue
  cancel-in-progress: false

jobs:
  research:
    name: Research prospect backlog validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token and run research queue
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-research")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          base_url="https://www.arborlineconnect.com/api/cron/connect-research"

          run_research() {
            local segment="$1"
            local output="/tmp/research-${segment}.json"
            curl --fail-with-body --silent --show-error \
              --max-time 240 \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "User-Agent: ArborLine-GitHub-Research/1.0" \
              "${base_url}?segment=${segment}" > "${output}"
            echo "=== ${segment} ==="
            cat "${output}"
            echo
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            run_research "commercial-roofing" &
            pid1=$!
            run_research "pest-control" &
            pid2=$!
            run_research "fire-protection" &
            pid3=$!
            run_research "commercial-plumbing" &
            pid4=$!
            wait "${pid1}"
            wait "${pid2}"
            wait "${pid3}"
            wait "${pid4}"
          else
            curl --fail-with-body --silent --show-error \
              --max-time 240 \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "User-Agent: ArborLine-GitHub-Research/1.0" \
              "${base_url}"
            echo
          fi
