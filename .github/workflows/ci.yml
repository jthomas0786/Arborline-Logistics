name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node .github/scripts/check_connect_followup_approval_inheritance.mjs
      - run: node .github/scripts/check_connect_route_memory.mjs
      - run: npx --yes tsx@4.20.6 .github/scripts/check_connect_geo_targeting.ts
      - run: npm run typecheck
      - run: npm run build
