name: Fix Andrews numeric entities v5e

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fix-andrews-numeric-entities-v5e.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow numeric entity normalization patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/connect-public-research.ts')
          s = p.read_text()
          old = '''function decodeHtml(value: string) {
  return value
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '\"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");
}'''
          new = '''function decodeHtml(value: string) {
  const decodeNumericEntity = (match: string, rawCodePoint: string, radix: number) => {
    const codePoint = Number.parseInt(rawCodePoint, radix);
    if (!Number.isInteger(codePoint) || codePoint < 0 || codePoint > 0x10ffff) return match;
    try {
      return String.fromCodePoint(codePoint);
    } catch {
      return match;
    }
  };

  return value
    .replace(/&#(\\d+);/g, (match, rawCodePoint: string) => decodeNumericEntity(match, rawCodePoint, 10))
    .replace(/&#x([0-9a-f]+);/gi, (match, rawCodePoint: string) => decodeNumericEntity(match, rawCodePoint, 16))
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '\"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");
}'''
          if old not in s:
              raise SystemExit('decodeHtml anchor not found; refusing broad patch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          pkg = Path('package.json')
          ps = pkg.read_text()
          old_version = '"arborlineResearchVersion": "crawler-narrative-exec-v5d"'
          new_version = '"arborlineResearchVersion": "crawler-narrative-exec-v5e"'
          if old_version not in ps:
              raise SystemExit('research version anchor not found; refusing patch')
          pkg.write_text(ps.replace(old_version, new_version, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify strict research safety invariants were not weakened
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('lib/connect-public-research.ts').read_text()
          required = [
            'STRUCTURED_PERSON',
            'MAILTO_PERSON_ANCHOR',
            'strictPublishedObservationForName',
            'acceptedStrictBindings',
            'GENERIC_EMAIL_LOCAL_PARTS'
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'missing safety invariant markers: {missing}')
          if '.replace(/&#(\\d+);/g' not in s or '.replace(/&#x([0-9a-f]+);/gi' not in s:
              raise SystemExit('numeric entity normalization patch missing')
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts package.json
          git diff --cached --check
          git commit -m "Decode numeric HTML entities in crawler text"
          git push origin HEAD:main
