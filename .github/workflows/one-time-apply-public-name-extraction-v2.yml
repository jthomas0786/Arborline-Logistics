name: Apply public-name parser hardening v2

on:
  push:
    branches:
      - main
    paths:
      - "scripts/patch_public_name_extraction_v2.mjs"
      - ".github/workflows/one-time-apply-public-name-extraction-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch parser
        run: node scripts/patch_public_name_extraction_v2.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit parser hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts
          if git diff --cached --quiet; then
            echo "No parser changes were required."
            exit 0
          fi
          git commit -m "Harden public research name extraction"
          git push origin HEAD:main
