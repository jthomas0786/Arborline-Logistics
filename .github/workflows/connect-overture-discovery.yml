name: ArborLine Overture Discovery

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connect-overture-discovery.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-overture-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Discover Overture public places
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Overture client
        run: python -m pip install --disable-pip-version-check --no-input overturemaps

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-overture")"
          token="$(printf '%s' "${response}" | jq -r '.value')"
          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Download, filter, and ingest public places
        env:
          ARBORLINE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          day_index="$(( $(date -u +%s) / 86400 ))"
          # Workflow-file pushes run a focused, no-provider-spend boost for the
          # four newly activated verticals across fresh metro regions.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            python scripts/connect_overture_new_vertical_boost.py
          else
            python scripts/connect_overture_discovery.py --day-index "${day_index}"
          fi
