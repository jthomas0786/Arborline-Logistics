name: One-time Restore Overture Parser

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-restore-overture-parser.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven parser and keep Supabase ingestion endpoint
        shell: bash
        run: |
          set -euo pipefail
          git show 9141c98218427bf20614210eb56b7c1f6f87b5d4:scripts/connect_overture_discovery.py > scripts/connect_overture_discovery.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/connect_overture_discovery.py')
          text = path.read_text()
          old = 'API_URL = "https://www.arborlineconnect.com/api/cron/connect-overture-discovery"'
          new = 'API_URL = "https://bjqkmcsduhazieuzegqi.supabase.co/functions/v1/connect-overture-ingest"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy API_URL, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          python -m py_compile scripts/connect_overture_discovery.py scripts/connect_overture_tier1_expansion.py
          grep -q 'SEGMENT_PATTERNS' scripts/connect_overture_discovery.py
          grep -q 'commercial-roofing' scripts/connect_overture_discovery.py
          grep -q 'pest-control' scripts/connect_overture_discovery.py
          grep -q 'fire-protection' scripts/connect_overture_discovery.py
          grep -q 'commercial-plumbing' scripts/connect_overture_discovery.py
          grep -q 'SUPABASE_EDGE' supabase/functions/connect-overture-ingest/index.ts 2>/dev/null || true
          git diff --check

      - name: Commit restored parser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/connect_overture_discovery.py
          git diff --cached --quiet && { echo 'No parser repair needed.'; exit 0; }
          git commit -m "Restore mature Overture prospect filters"
          git push origin HEAD:main
