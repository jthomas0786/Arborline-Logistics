name: One-time harden national research deadlines

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-harden-national-research-deadlines.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply true crawler deadlines and stale-run recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          public_path = Path("lib/connect-public-research.ts")
          public = public_path.read_text()

          public = replace_once(
              public,
              'export type PublicResearchOptions = { expanded?: boolean; includePublicProfiles?: boolean };',
              'export type PublicResearchOptions = { expanded?: boolean; includePublicProfiles?: boolean; deadlineMs?: number };',
              'public options deadline'
          )

          public = replace_once(
              public,
              '''function normalizeHost(value: string) {''',
              '''function deadlineTimeoutMs(deadlineAt: number | null) {
            if (deadlineAt === null) return FETCH_TIMEOUT_MS;
            const remaining = deadlineAt - Date.now();
            if (remaining <= 0) return 0;
            return Math.max(1, Math.min(FETCH_TIMEOUT_MS, remaining));
          }

          function normalizeHost(value: string) {''',
              'deadline helper'
          )

          public = replace_once(
              public,
              '''async function fetchPublicProfileText(url: string, maxRedirects = 2): Promise<{ url: string; text: string; contentType: string } | null> {
            let current = new URL(url);
            for (let redirect = 0; redirect <= maxRedirects; redirect++) {
              if (!/^https?:$/.test(current.protocol) || !publicProfileHostAllowed(current.hostname) || isIP(current.hostname)) return null;
              const response = await fetch(current, {''',
              '''async function fetchPublicProfileText(url: string, maxRedirects = 2, deadlineAt: number | null = null): Promise<{ url: string; text: string; contentType: string } | null> {
            let current = new URL(url);
            for (let redirect = 0; redirect <= maxRedirects; redirect++) {
              if (!/^https?:$/.test(current.protocol) || !publicProfileHostAllowed(current.hostname) || isIP(current.hostname)) return null;
              const timeoutMs = deadlineTimeoutMs(deadlineAt);
              if (timeoutMs <= 0) return null;
              const response = await fetch(current, {''',
              'profile fetch deadline'
          )

          public = replace_once(
              public,
              '''async function fetchText(url: string, domain: string, maxRedirects = 3): Promise<{ url: string; text: string; contentType: string } | null> {
            let current = new URL(url);
            for (let redirect = 0; redirect <= maxRedirects; redirect++) {
              if (!/^https?:$/.test(current.protocol) || !hostAllowed(current.hostname, domain) || isIP(current.hostname)) return null;

              const response = await fetch(current, {''',
              '''async function fetchText(url: string, domain: string, maxRedirects = 3, deadlineAt: number | null = null): Promise<{ url: string; text: string; contentType: string } | null> {
            let current = new URL(url);
            for (let redirect = 0; redirect <= maxRedirects; redirect++) {
              if (!/^https?:$/.test(current.protocol) || !hostAllowed(current.hostname, domain) || isIP(current.hostname)) return null;
              const timeoutMs = deadlineTimeoutMs(deadlineAt);
              if (timeoutMs <= 0) return null;

              const response = await fetch(current, {''',
              'site fetch deadline'
          )

          if public.count('signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)') != 2:
              raise SystemExit(f"fetch signal replacements: expected 2, found {public.count('signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)')}")
          public = public.replace('signal: AbortSignal.timeout(FETCH_TIMEOUT_MS)', 'signal: AbortSignal.timeout(timeoutMs)')

          public = replace_once(
              public,
              '''  if (!validPublicDomain(domain)) {
            return { status: "BLOCKED", domain, candidate: null, publishedEmails: [], pagesChecked: [], robotsRespected: true, error: "Invalid or non-public domain." };
          }

          try {''',
              '''  if (!validPublicDomain(domain)) {
            return { status: "BLOCKED", domain, candidate: null, publishedEmails: [], pagesChecked: [], robotsRespected: true, error: "Invalid or non-public domain." };
          }

          const configuredDeadlineMs = Number(options.deadlineMs);
          const deadlineAt = Number.isFinite(configuredDeadlineMs) && configuredDeadlineMs > 0
            ? Date.now() + Math.max(1_000, Math.min(120_000, Math.floor(configuredDeadlineMs)))
            : null;
          const deadlineReached = () => deadlineAt !== null && Date.now() >= deadlineAt;

          try {''',
              'research deadline setup'
          )

          public = replace_once(public, 'fetchText(`https://${domain}/robots.txt`, domain)', 'fetchText(`https://${domain}/robots.txt`, domain, 3, deadlineAt)', 'robots deadline')
          public = replace_once(public, 'fetchText(sitemapUrl, domain)', 'fetchText(sitemapUrl, domain, 3, deadlineAt)', 'sitemap deadline')
          public = replace_once(public, 'try { fetched = await fetchText(next, domain); } catch { continue; }', 'try { fetched = await fetchText(next, domain, 3, deadlineAt); } catch { continue; }', 'page deadline')
          public = replace_once(public, 'const fetched = await fetchPublicProfileText(profileUrl);', 'const fetched = await fetchPublicProfileText(profileUrl, 2, deadlineAt);', 'profile deadline call')
          public = replace_once(public, 'for (const sitemapUrl of [`https://${domain}/sitemap.xml`, `https://${domain}/wp-sitemap.xml`]) {\n        try {', 'for (const sitemapUrl of [`https://${domain}/sitemap.xml`, `https://${domain}/wp-sitemap.xml`]) {\n        if (deadlineReached()) break;\n        try {', 'sitemap deadline guard')
          public = replace_once(public, 'while (queue.length && pages.length < pageLimit) {', 'while (queue.length && pages.length < pageLimit && !deadlineReached()) {', 'page loop deadline guard')
          public = replace_once(public, 'for (const profileUrl of profileLinks) {\n        try {', 'for (const profileUrl of profileLinks) {\n        if (deadlineReached()) break;\n        try {', 'profile deadline guard')
          public = replace_once(
              public,
              '''    return {
              status: candidate ? "CANDIDATE_FOUND" : "NO_MATCH",
              domain,
              candidate,
              publishedEmails,
              pagesChecked: allEvidencePages.map((page) => page.url),
              robotsRespected: true,
              serviceFit
            };''',
              '''    const deadlineExceeded = deadlineReached();
            return {
              status: candidate ? "CANDIDATE_FOUND" : deadlineExceeded ? "ERROR" : "NO_MATCH",
              domain,
              candidate,
              publishedEmails,
              pagesChecked: allEvidencePages.map((page) => page.url),
              robotsRespected: true,
              serviceFit,
              ...(deadlineExceeded && !candidate ? { error: "Public research reached its configured deadline." } : {})
            };''',
              'deadline result status'
          )

          public_path.write_text(public)

          fleet_path = Path("lib/connect-national-worker-fleet.ts")
          fleet = fleet_path.read_text()

          fleet = replace_once(fleet, 'const NATIONAL_PUBLIC_RESEARCH_TIMEOUT_MS = 50_000;', 'const NATIONAL_PUBLIC_RESEARCH_TIMEOUT_MS = 45_000;', 'worker timeout')
          fleet = replace_once(
              fleet,
              'researchPublicCompanySite(domain, titles, segmentSlug, targetIndustries, options),',
              'researchPublicCompanySite(domain, titles, segmentSlug, targetIndustries, { ...options, deadlineMs: NATIONAL_PUBLIC_RESEARCH_TIMEOUT_MS - 5_000 }),',
              'worker crawler deadline'
          )

          benchmark_filter = "AND coalesce(p.source_metadata->>'research_benchmark_version','') <> '2'"
          benchmark_filter_new = """AND coalesce(p.source_metadata->>'research_benchmark_version','') <> '2'
                   AND (
                     nullif(p.source_metadata->>'research_benchmark_retry_after','') IS NULL
                     OR (p.source_metadata->>'research_benchmark_retry_after')::timestamptz <= now()
                   )"""
          if fleet.count(benchmark_filter) != 2:
              raise SystemExit(f"benchmark retry filters: expected 2, found {fleet.count(benchmark_filter)}")
          fleet = fleet.replace(benchmark_filter, benchmark_filter_new)

          fleet = replace_once(
              fleet,
              '...(benchmarkMode ? { research_benchmark_version: "2", research_benchmark_checked_at: checkedAt } : {}),',
              '''...(benchmarkMode ? {
                research_benchmark_checked_at: checkedAt,
                research_benchmark_version: result.status === "ERROR" ? null : "2",
                research_benchmark_retry_after: result.status === "ERROR"
                  ? new Date(Date.now() + 6 * 60 * 60_000).toISOString()
                  : null
              } : {}),''',
              'benchmark error backoff metadata'
          )

          fleet = replace_once(
              fleet,
              '''async function recoverStaleNationalJobs() {
            await getPool().query(
              `UPDATE connect_worker_jobs
               SET status='RETRY',run_at=now(),locked_at=NULL,locked_by=NULL,heartbeat_at=NULL,
                   last_error='Recovered after stale national worker lock.',updated_at=now()
               WHERE worker_type IN ('COORDINATE','RESEARCH','NATIVE_ENRICH','PROVIDER_ENRICH')
                 AND status='RUNNING' AND locked_at < now() - interval '15 minutes'`
            );
          }''',
              '''async function recoverStaleNationalJobs() {
            await getPool().query(
              `WITH recovered AS (
                 UPDATE connect_worker_jobs
                 SET status='RETRY',run_at=now(),locked_at=NULL,locked_by=NULL,heartbeat_at=NULL,
                     last_error='Recovered after stale national worker lock.',updated_at=now()
                 WHERE worker_type IN ('COORDINATE','RESEARCH','NATIVE_ENRICH','PROVIDER_ENRICH')
                   AND status='RUNNING' AND locked_at < now() - interval '15 minutes'
                 RETURNING id,attempts
               )
               UPDATE connect_worker_runs r
               SET status='RETRY',
                   error_message=coalesce(r.error_message,'Recovered after stale national worker lock.'),
                   completed_at=coalesce(r.completed_at,now())
               FROM recovered
               WHERE r.job_id=recovered.id
                 AND r.status='RUNNING'
                 AND r.attempt<=recovered.attempts`
            );
          }''',
              'stale run recovery'
          )

          fleet_path.write_text(fleet)
          PY

          git diff --check
          git diff -- lib/connect-public-research.ts lib/connect-national-worker-fleet.ts

      - name: Commit deadline hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts lib/connect-national-worker-fleet.ts
          git commit -m "Enforce true national research crawl deadlines"
          git push origin HEAD:main
