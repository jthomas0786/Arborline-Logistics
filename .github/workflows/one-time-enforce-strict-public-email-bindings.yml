name: One-time enforce strict public email bindings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-enforce-strict-public-email-bindings.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce strict public person-email bindings
        run: python scripts/enforce-strict-public-email-bindings.py

      - name: Validate patch
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
          git diff -- lib/connect-public-research.ts lib/connect-native-enrichment.ts

      - name: Commit strict binding enforcement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts lib/connect-native-enrichment.ts
          git commit -m "Enforce exact public person-email bindings"
          git push origin HEAD:main
