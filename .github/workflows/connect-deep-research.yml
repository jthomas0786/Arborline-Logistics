name: ArborLine Deep Research Fleet

# Native-only correction commits can rebuild candidates without rerunning public research.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/connect-deep-research-workers.ts"
      - "app/api/cron/connect-deep-research/route.ts"
      - ".github/workflows/connect-deep-research.yml"
      - ".github/benchmark-prospect-id.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-deep-research-fleet
  cancel-in-progress: false

jobs:
  decision-maker:
    if: ${{ github.event_name != 'push' || (github.event.head_commit.message != 'Run native correction pass' && !startsWith(github.event.head_commit.message, 'Benchmark prospect ')) }}
    name: Resolve strongest decision makers · stage ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [1, 2, 3, 4]
    steps:
      - name: Run deep executive resolver
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://www.arborlineconnect.com/api/cron/connect-deep-research?mode=decision-maker&limit=4"
          for attempt in $(seq 1 12); do
            separator="&"
            if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then separator="?"; fi
            oidc_response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-deep-research")"
            oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"
            set +e
            response="$(curl --silent --show-error --max-time 300 \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "User-Agent: ArborLine-Deep-DM/3.0-stage-${{ matrix.stage }}" \
              -w $'\n%{http_code}' "${endpoint}")"
            curl_status=$?
            set -e
            http_status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "Attempt ${attempt}: HTTP ${http_status:-unknown}"
            if [[ -n "${body}" ]]; then printf '%s\n' "${body}" | jq . 2>/dev/null || printf '%s\n' "${body}"; fi
            if [[ ${curl_status} -eq 0 && "${http_status}" == "200" ]]; then
              printf '%s' "${body}" | jq -e '.ok == true and .safety.providerCallsMade == 0 and .safety.messagesSent == 0' >/dev/null
              exit 0
            fi
            if [[ ${attempt} -lt 12 ]]; then sleep 15; fi
          done
          exit 1

  published-email:
    if: ${{ github.event_name != 'push' || (github.event.head_commit.message != 'Run native correction pass' && !startsWith(github.event.head_commit.message, 'Benchmark prospect ')) }}
    name: Hunt published direct emails · stage ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stage: [1, 2, 3, 4]
    steps:
      - name: Run exact-identity published-email hunter
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://www.arborlineconnect.com/api/cron/connect-deep-research?mode=published-email&limit=4"
          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then separator="?"; fi
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-deep-research")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"
          response="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "User-Agent: ArborLine-Deep-Email/3.0-stage-${{ matrix.stage }}" \
            "${endpoint}")"
          printf '%s\n' "${response}" | jq .
          printf '%s' "${response}" | jq -e '.ok == true and .safety.providerCallsMade == 0 and .safety.messagesSent == 0' >/dev/null

  native-candidates:
    name: Build verification-ready native candidates
    needs: [decision-maker, published-email]
    if: ${{ always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Benchmark prospect ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build candidates for the existing mailbox verifier
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://www.arborlineconnect.com/api/cron/connect-deep-research?mode=native-candidates&limit=50"
          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then separator="?"; fi
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-deep-research")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"
          response="$(curl --fail-with-body --silent --show-error --max-time 240 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "User-Agent: ArborLine-Deep-Native/3.0" \
            "${endpoint}")"
          printf '%s\n' "${response}" | jq .
          printf '%s' "${response}" | jq -e '.ok == true and .safety.providerCallsMade == 0 and .safety.messagesSent == 0' >/dev/null

  benchmark-prospect:
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Benchmark prospect ') }}
    name: Targeted protected research benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run targeted decision-maker benchmark
        shell: bash
        run: |
          set -euo pipefail
          prospect_id="$(tr -d '\r\n ' < .github/benchmark-prospect-id.txt)"
          [[ "${prospect_id}" =~ ^[0-9a-fA-F-]{36}$ ]]
          endpoint="https://www.arborlineconnect.com/api/cron/connect-deep-research?mode=decision-maker&limit=1&prospectId=${prospect_id}"
          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then separator="?"; fi
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-deep-research")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"
          response="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "User-Agent: ArborLine-Targeted-Benchmark/1.0" \
            "${endpoint}")"
          printf '%s\n' "${response}" | jq .
          printf '%s' "${response}" | jq -e '.ok == true and .result.attempted == 1 and .safety.providerCallsMade == 0 and .safety.messagesSent == 0 and .safety.outreachApprovalsCreated == 0' >/dev/null

# Validation trigger: strict public-person pattern native-only pass.
# Full decision-maker refresh trigger: 2026-09-22.
