name: ArborLine General Worker Queue

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-general-workers
  cancel-in-progress: false

jobs:
  run-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token and run worker queue
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-workers")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --max-time 180             -H "Authorization: Bearer ${oidc_token}"             -H "User-Agent: ArborLine-GitHub-Workers/1.0"             "https://www.arborlineconnect.com/api/cron/connect-workers"
          echo
