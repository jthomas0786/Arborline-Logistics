name: Patch Review Research Pipeline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-review-research.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply review research patch
        run: python scripts/patch_review_research_pipeline.py

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts app/api/cron/connect-research/route.ts lib/connect-public-discovery.ts scripts/connect_overture_discovery.py
          git diff --cached --check
          git commit -m "Research strong review prospects before qualification"
          git push
