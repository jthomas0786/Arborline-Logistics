name: One-time Connect geo shared inbox fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fix-connect-geo-shared-inbox.yml"
      - ".github/scripts/patch_connect_geo_shared_inbox.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded shared-inbox geography patch
        run: python .github/scripts/patch_connect_geo_shared_inbox.py
      - run: npm install --no-audit --no-fund
      - run: npx --yes tsx@4.20.6 .github/scripts/check_connect_geo_targeting.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Preserve strict public-email safety markers
        run: |
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'strictPublishedObservationForName' lib/connect-public-research.ts
          grep -q 'acceptedStrictBindings' lib/connect-public-research.ts
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-contact-targeting.ts
          git diff --cached --check
          git commit -m "Harden shared inbox geography matching"
          git push origin HEAD:main
