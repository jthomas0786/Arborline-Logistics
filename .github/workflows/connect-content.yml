name: ArborLine Content Agent

on:
  schedule:
    - cron: "35 14 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connect-content.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-content-agent
  cancel-in-progress: false

jobs:
  generate:
    name: Queue fresh personal LinkedIn draft
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Allow production deploy to catch up
        if: github.event_name == 'push'
        shell: bash
        run: sleep 20

      - name: Request GitHub OIDC token and run Content Agent
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-content")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          curl --fail-with-body --silent --show-error             --retry 6             --retry-delay 20             --retry-all-errors             --max-time 120             -H "Authorization: Bearer ${oidc_token}"             -H "User-Agent: ArborLine-GitHub-Content/1.0"             --write-out "\\nHTTP %{http_code}\\n" \\
            "https://arborline-connect.onrender.com/api/cron/connect-content"
          echo
