name: Patch Service Fit Queue Priority

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-service-fit-priority.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply priority patch
        run: python scripts/patch_service_fit_priority.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          git diff --check
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts app/api/cron/connect-research/route.ts
          git diff --cached --check
          git commit -m "Prioritize service fit verification backlog"
          git push
