name: ArborLine Public Discovery

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connect-discovery.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: arborline-public-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Discover public prospects
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token and run discovery
        shell: bash
        run: |
          set -euo pipefail

          separator="&"
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" != *"?"* ]]; then
            separator="?"
          fi

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=arborline-connect-discovery")"
          oidc_token="$(printf '%s' "${oidc_response}" | jq -r '.value')"

          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "GitHub did not issue an OIDC token."
            exit 1
          fi

          run_discovery() {
            local url="$1"
            curl --fail-with-body --silent --show-error \
              --max-time 120 \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "User-Agent: ArborLine-GitHub-Discovery/1.0" \
              "${url}"
            echo
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Running metro-tile validation for newly activated verticals."
            run_discovery "https://www.arborlineconnect.com/api/cron/connect-discovery?segment=commercial-roofing&geography=Illinois"
            run_discovery "https://www.arborlineconnect.com/api/cron/connect-discovery?segment=pest-control&geography=Illinois"
            run_discovery "https://www.arborlineconnect.com/api/cron/connect-discovery?segment=fire-protection&geography=Illinois"
            run_discovery "https://www.arborlineconnect.com/api/cron/connect-discovery?segment=commercial-plumbing&geography=Illinois"
          else
            run_discovery "https://www.arborlineconnect.com/api/cron/connect-discovery"
          fi
