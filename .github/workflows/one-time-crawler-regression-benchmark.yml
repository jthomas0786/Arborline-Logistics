name: Run crawler regression benchmarks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-crawler-regression-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow parser patch
        run: python .github/scripts/patch_andrews_numeric_entities_v5e.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify strict public-email safety markers
        run: |
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'strictPublishedObservationForName' lib/connect-public-research.ts
          grep -q 'acceptedStrictBindings' lib/connect-public-research.ts
          grep -q 'GENERIC_EMAIL_LOCAL_PARTS' lib/connect-public-research.ts
      - name: Run decision-maker regressions
        run: npx --yes tsx@4.20.6 .github/scripts/crawler_regression_benchmark_v5e.ts
      - name: Commit validated parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts package.json
          git diff --cached --check
          git commit -m "Decode numeric HTML entities in crawler text"
          git pull --rebase origin main
          git push origin HEAD:main
