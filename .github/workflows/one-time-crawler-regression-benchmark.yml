name: Run crawler regression benchmarks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-crawler-regression-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply narrow Andrews parser fix in working tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('lib/connect-public-research.ts')
          text = source.read_text()
          old = '''function decodeHtml(value: string) {
  return value
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '\"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");
}'''
          new = '''function decodeHtml(value: string) {
  const decodeNumericEntity = (match: string, rawCodePoint: string, radix: number) => {
    const codePoint = Number.parseInt(rawCodePoint, radix);
    if (!Number.isInteger(codePoint) || codePoint < 0 || codePoint > 0x10ffff) return match;
    try {
      return String.fromCodePoint(codePoint);
    } catch {
      return match;
    }
  };

  return value
    .replace(/&#(\\d+);/g, (match, rawCodePoint: string) => decodeNumericEntity(match, rawCodePoint, 10))
    .replace(/&#x([0-9a-f]+);/gi, (match, rawCodePoint: string) => decodeNumericEntity(match, rawCodePoint, 16))
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '\"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">");
}'''
          if old not in text:
              raise SystemExit('decodeHtml anchor not found; refusing broad parser edit')
          source.write_text(text.replace(old, new, 1))

          package = Path('package.json')
          package_text = package.read_text()
          old_version = '"arborlineResearchVersion": "crawler-narrative-exec-v5d"'
          new_version = '"arborlineResearchVersion": "crawler-narrative-exec-v5e"'
          if old_version not in package_text:
              raise SystemExit('research-version anchor not found; refusing version rewrite')
          package.write_text(package_text.replace(old_version, new_version, 1))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify strict public-email safety markers remain intact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('lib/connect-public-research.ts').read_text()
          required = [
            'STRUCTURED_PERSON',
            'MAILTO_PERSON_ANCHOR',
            'strictPublishedObservationForName',
            'acceptedStrictBindings',
            'GENERIC_EMAIL_LOCAL_PARTS'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing strict-binding safety markers: {missing}')
          if '.replace(/&#(\\d+);/g' not in text or '.replace(/&#x([0-9a-f]+);/gi' not in text:
              raise SystemExit('numeric HTML entity decoder was not installed')
          PY
      - name: Run Andrews, Cintas, and Priority crawler regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > .crawler-benchmark.ts <<'TS'
          import { researchPublicCompanySite } from "./lib/connect-public-research";

          async function main() {
            const titles = [
              "Owner","President","CEO","Founder","General Manager","Managing Partner","COO","Chief Operating Officer",
              "VP Sales","Vice President of Sales","Sales Director","Sales Manager","Director of Business Development",
              "Business Development Manager","Director of Operations"
            ];

            const cases = [
              { key: "ANDREWS", domain: "andrewsheating.com", segment: "hvac", industries: ["HVAC","Heating & Air Conditioning","Mechanical Services","Commercial HVAC"], city: "Clinton", state: "Indiana", employeeCount: 10, locationCount: null },
              { key: "CINTAS", domain: "cintas.com", segment: "fire-protection", industries: ["Fire Protection Services","Fire Sprinkler Services","Fire Alarm Services","Fire Extinguisher Services","Life Safety Services"], city: "Lombard", state: "Illinois", employeeCount: null, locationCount: null },
              { key: "PRIORITY", domain: "prioritylandscape.net", segment: "landscaping", industries: ["Landscaping Services","Commercial Landscaping","Grounds Maintenance","Landscape Maintenance","Commercial Lawn Care"], city: "Gary", state: "Indiana", employeeCount: null, locationCount: null }
            ] as const;

            const output: Record<string, any> = {};
            for (const item of cases) {
              const result = await researchPublicCompanySite(item.domain, titles, item.segment, [...item.industries], {
                expanded: true,
                includePublicProfiles: true,
                targetCity: item.city,
                targetState: item.state,
                employeeCount: item.employeeCount,
                locationCount: item.locationCount,
                deadlineMs: 100000
              });
              output[item.key] = {
                status: result.status,
                candidate: result.candidate ? {
                  name: result.candidate.name,
                  title: result.candidate.title,
                  decisionMakerConfidence: result.candidate.decisionMakerConfidence,
                  targetingScore: result.candidate.targetingScore,
                  targetingLocationMatch: result.candidate.targetingLocationMatch,
                  sourceUrl: result.candidate.sourceUrl,
                  publishedEmail: result.candidate.publishedEmail,
                  evidence: result.candidate.evidence
                } : null,
                sharedInboxCandidates: result.sharedInboxCandidates,
                diagnostics: result.diagnostics,
                pagesChecked: result.pagesChecked,
                error: result.error ?? null
              };
            }

            console.log("ARBORLINE_CRAWLER_BENCHMARK_START");
            console.log(JSON.stringify(output, null, 2));
            console.log("ARBORLINE_CRAWLER_BENCHMARK_END");

            const andrews = output.ANDREWS;
            const cintas = output.CINTAS;
            const priority = output.PRIORITY;

            if (String(andrews?.candidate?.name ?? "").toLowerCase() !== "doug andrews") throw new Error(`Andrews expected Doug Andrews; got ${andrews?.candidate?.name ?? "no candidate"}`);
            if (!/^(president|ceo)$/i.test(String(andrews?.candidate?.title ?? ""))) throw new Error(`Andrews expected President/CEO evidence; got ${andrews?.candidate?.title ?? "no title"}`);
            if (andrews?.candidate?.publishedEmail) throw new Error("Andrews must not invent or promote a Doug email.");

            if (String(cintas?.candidate?.name ?? "").toLowerCase() === "catie bancroft") throw new Error("Cintas regression: Catie Bancroft false positive returned.");
            if (cintas?.candidate && String(cintas.candidate.name).toLowerCase() !== "james n. rozakis") throw new Error(`Cintas expected James N. Rozakis when a candidate is available; got ${cintas.candidate.name}`);
            if (cintas?.candidate?.publishedEmail) throw new Error("Cintas benchmark must not promote an unbound person email.");

            if (String(priority?.candidate?.name ?? "").toLowerCase() !== "neftali robles") throw new Error(`Priority expected Neftali Robles; got ${priority?.candidate?.name ?? "no candidate"}`);
            if (String(priority?.candidate?.name ?? "").toLowerCase() === "west michigan") throw new Error("Priority regression: West Michigan was treated as a person.");
            if (Number(priority?.candidate?.decisionMakerConfidence ?? 0) < 85) throw new Error(`Priority confidence below 85: ${priority?.candidate?.decisionMakerConfidence ?? 0}`);
            if (Number(priority?.candidate?.targetingScore ?? 0) < 100) throw new Error(`Priority targeting score below 100: ${priority?.candidate?.targetingScore ?? 0}`);
            if (priority?.candidate?.targetingLocationMatch !== "TARGET_CITY") throw new Error(`Priority location match regressed: ${priority?.candidate?.targetingLocationMatch ?? "none"}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          TS
          npx --yes tsx@4.20.6 .crawler-benchmark.ts
      - name: Commit validated parser fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts package.json
          git diff --cached --check
          git commit -m "Decode numeric HTML entities in crawler text"
          git pull --rebase origin main
          git push origin HEAD:main
