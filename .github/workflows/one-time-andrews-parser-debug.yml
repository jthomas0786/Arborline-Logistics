name: Debug Andrews narrative parser

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-andrews-parser-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trace exact Andrews candidate guards
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://andrewsheating.com/about-us/', {headers:{'user-agent':'ArborLineResearch/1.0'}});
          const rawHtml = await response.text();
          const html = rawHtml.slice(0, 750_000);
          const NON_PERSON_TERMS = new Set([
            "about", "air", "business", "cleaner", "cleaners", "cleaning", "commercial", "company", "contact",
            "contractor", "contractors", "cooling", "customer", "customers", "expert", "experts", "facility", "group",
            "grounds", "heating", "helping", "home", "house", "hvac", "janitorial", "landscape", "landscaping", "lawn",
            "local", "management", "mechanical", "office", "professional", "professionals", "recruiting", "residential",
            "restoration", "service", "services", "solutions", "specialist", "specialists", "staff", "staffing", "team",
            "technician", "technicians", "typical", "workforce", "suppression", "roof", "roofer", "roofers", "roofing",
            "pest", "plumber", "plumbers", "plumbing", "fire", "protection", "sprinkler", "sprinklers",
            "quote", "request", "schedule", "call", "free", "downtown", "view", "all", "projects", "learn", "more",
            "from", "our", "meet", "the", "trusted", "by", "welcome", "your", "read", "know",
            "certified", "arborist", "united", "states", "government", "strip", "mall", "ceo", "cfo", "coo",
            "software", "development", "engineering", "technology", "technologies", "digital", "accounting", "finance", "financial",
            "human", "resources", "administration", "administrative", "administrator", "procurement", "purchasing", "department", "division",
            "outgoing", "incoming", "appointed", "former", "retiring", "retired", "interim", "association", "associations"
          ]);
          const NAME_PARTICLES = new Set(["al", "bin", "da", "de", "del", "della", "der", "di", "du", "la", "le", "van", "von"]);
          const HONORIFICS = new Set(["mr", "mrs", "ms", "miss", "dr", "prof", "professor", "sir", "madam"]);
          const NAME_SUFFIXES = new Set(["jr", "sr", "ii", "iii", "iv"]);
          const NON_PERSON_PHRASES = ["master gardener", "stewardship taking", "partners personnel", "yer usa", "german desk"];
          const US_STATE_NAMES = new Set(["alabama","alaska","arizona","arkansas","california","colorado","connecticut","delaware","florida","georgia","hawaii","idaho","illinois","indiana","iowa","kansas","kentucky","louisiana","maine","maryland","massachusetts","michigan","minnesota","mississippi","missouri","montana","nebraska","nevada","new hampshire","new jersey","new mexico","new york","north carolina","north dakota","ohio","oklahoma","oregon","pennsylvania","rhode island","south carolina","south dakota","tennessee","texas","utah","vermont","virginia","washington","west virginia","wisconsin","wyoming"]);
          const GEO_DIRECTION_WORDS = new Set(["north","south","east","west","central","northern","southern","eastern","western","northeast","northwest","southeast","southwest","metro","greater","midwest","midwestern","region","regional"]);
          const decodeHtml = value => value.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>');
          const htmlToText = input => decodeHtml(input.replace(/<!--[\s\S]*?-->/g,' ').replace(/<(script|style|noscript|svg|template)[^>]*>[\s\S]*?<\/\1>/gi,' ').replace(/<(br|\/p|\/div|\/li|\/h[1-6]|\/tr)>/gi,'\n').replace(/<[^>]+>/g,' ')).replace(/\r/g,'').replace(/[\t ]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
          const normalizeTitle = value => value.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const cleanName = value => value.replace(/\s*[|•·–—,:]+\s*/g,' ').replace(/^(?:sincerely|best regards|kind regards|regards|respectfully|operator)\s+/i,'').replace(/^[^A-Za-zÀ-ÖØ-öø-ÿ]+|[^A-Za-zÀ-ÖØ-öø-ÿ.'’-]+$/g,'').replace(/\s+/g,' ').replace(/\s+Co-$/i,'').replace(/\s+I$/,'').trim();
          const titleCaseNameToken = word => { const stripped=word.replace(/[.'’-]/g,''); if(!stripped)return false; if(/^[A-Z]{1,4}$/.test(stripped))return true; return /^[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ]*$/.test(stripped); };
          const looksLikeGeographyLabel = value => { const normalized=normalizeTitle(cleanName(value)); if(!normalized)return false; if(US_STATE_NAMES.has(normalized))return true; const words=normalized.split(' ').filter(Boolean); if(words.length<2||words.length>4)return false; const hasDirection=words.some(w=>GEO_DIRECTION_WORDS.has(w)); const hasState=[...US_STATE_NAMES].some(state=>normalized===state||normalized.endsWith(` ${state}`)); const hasRegionWord=words.some(w=>["region","regional","metro","area","territory"].includes(w)); return (hasDirection&&hasState)||(hasDirection&&hasRegionWord); };
          function looksLikePersonName(value) {
            const name=cleanName(value); if(name.length<4||name.length>70||/[!?=<>/@]/.test(name))return false;
            const words=name.split(' ').filter(Boolean); if(words.length<2||words.length>5)return false; if(words.some(word=>/\d|https?|www\./i.test(word)))return false; if(looksLikeGeographyLabel(name))return false;
            const normalizedWords=words.map(word=>word.toLowerCase().replace(/[^a-zà-öø-ÿ]/g,'')); const normalizedPhrase=normalizeTitle(name); if(NON_PERSON_PHRASES.some(phrase=>normalizedPhrase.includes(phrase)))return false;
            const substantiveTokens=normalizedWords.filter(word=>word&&!NAME_PARTICLES.has(word)&&!HONORIFICS.has(word)&&!NAME_SUFFIXES.has(word)); if(HONORIFICS.has(normalizedWords[0]??'')&&substantiveTokens.length<2)return false; if(words.length>3&&!normalizedWords.some(word=>NAME_PARTICLES.has(word)))return false; if(normalizedWords.some(word=>NON_PERSON_TERMS.has(word)))return false;
            const semanticBanned=/\b(team|leadership|management|contact|about|services?|company|landscap(?:e|ing)|hvac|clean(?:er|ers|ing)?|staffing|roof(?:er|ers|ing)?|pest|plumb(?:er|ers|ing)?|fire|protection|sprinklers?|suppression|quote|request|schedule|call|free|director|manager|president|owner|founder|chief|officer|sales|operations|commercial|residential|professionals?|specialists?|certified|arborist|government|strip|mall|ceo|cfo|coo|software|development|engineering|technology|technologies|digital|accounting|finance|financial|human|resources|administration|administrative|administrator|procurement|purchasing|department|division|outgoing|incoming|former|retiring|retired|interim|association|associations)\b/i; if(semanticBanned.test(name))return false;
            let primaryTokens=0; for(const word of words){const normalized=word.toLowerCase().replace(/[^a-zà-öø-ÿ]/g,''); if(NAME_PARTICLES.has(normalized)||HONORIFICS.has(normalized)||NAME_SUFFIXES.has(normalized))continue; primaryTokens++; if(!titleCaseNameToken(word))return false;} return primaryTokens>=2;
          }
          const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
          const normalizeNameToken = value => value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
          const normalizeDomain = value => value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].split(':')[0];
          function titleHasExternalAffiliation(value, domain) { const match=value.match(/\bof\s+(?:the\s+)?([A-Za-z0-9&.'’ -]{3,100})/i); if(!match)return false; const affiliation=normalizeNameToken(match[1]??''); const brand=normalizeNameToken(normalizeDomain(domain).split('.')[0]??''); if(!affiliation||!brand)return false; return !affiliation.includes(brand)&&!brand.includes(affiliation); }
          function extractFullNameMentions(text) { return [...text.matchAll(/\b([A-Z][A-Za-z'’.-]{1,30})\s+([A-Z][A-Za-z'’.-]{1,40})\b/g)].map(match=>({first:match[1],last:match[2],full:`${match[1]} ${match[2]}`})).filter(item=>looksLikePersonName(item.full)); }
          function resolveGivenNameFromFamilyContext(givenName,pageText){ const normalizedGiven=givenName.toLowerCase(); const names=extractFullNameMentions(pageText); console.log('FILTERED_NAMES',names); const direct=names.find(item=>item.first.toLowerCase()===normalizedGiven); if(direct)return {name:direct.full,reason:'DIRECT_FULL_NAME_ON_PAGE'}; const surnameVotes=new Map(); const vote=surname=>surnameVotes.set(surname,(surnameVotes.get(surname)??0)+1); for(const item of names){const escapedFull=escapeRegex(item.full); const escapedGiven=escapeRegex(givenName); const childOfGiven=new RegExp(`${escapedFull}[^.!?]{0,60}${escapedGiven}[’']s\\s+(?:son|daughter)`,'i'); if(childOfGiven.test(pageText)){console.log('CHILD_OF_GIVEN_MATCH',item.full);vote(item.last);} const escapedFirst=escapeRegex(item.first); const givenChildOfNamedParent=new RegExp(`${escapedGiven}[^.!?]{0,80}${escapedFirst}[’']s\\s+(?:son|daughter)`,'i'); if(givenChildOfNamedParent.test(pageText)){console.log('GIVEN_CHILD_OF_PARENT_MATCH',item.full);vote(item.last);}} const ranked=[...surnameVotes.entries()].sort((a,b)=>b[1]-a[1]); console.log('SURNAME_VOTES',ranked); if(!ranked.length)return null; if(ranked.length>1&&ranked[0][1]===ranked[1][1])return null; return {name:`${givenName} ${ranked[0][0]}`,reason:'EXPLICIT_FAMILY_RELATIONSHIP'}; }

          const text=htmlToText(html);
          const role='President';
          const statementPattern=new RegExp(`(?:^|[.!?]\\s+)(?:In\\s+\\d{4}\\s+)?([A-Z][A-Za-z'’.-]{1,30})\\s+(?:became|is|serves\\s+as|was\\s+named|was\\s+appointed|was\\s+promoted\\s+to)\\s+(?:the\\s+)?${escapeRegex(role)}\\b`,'gi');
          const matches=[...text.matchAll(statementPattern)];
          console.log('STATEMENT_MATCHES',matches.map(m=>({text:m[0],given:m[1],index:m.index})));
          for(const statement of matches){
            const givenName=statement[1];
            const resolved=resolveGivenNameFromFamilyContext(givenName,text);
            console.log('RESOLVED',resolved,'LOOKS_PERSON',resolved?looksLikePersonName(resolved.name):null);
            const statementText=statement[0]??''; const statementIndex=statement.index??0; const statementWindow=text.slice(Math.max(0,statementIndex-80),Math.min(text.length,statementIndex+statementText.length+180));
            console.log('STATEMENT_WINDOW',JSON.stringify(statementWindow));
            console.log('EXTERNAL_AFFILIATION',titleHasExternalAffiliation(statementWindow,'andrewsheating.com'));
          }
          NODE
