name: Debug Andrews narrative parser

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-andrews-parser-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect Andrews normalized public text
        shell: bash
        run: |
          node <<'NODE'
          const html = await (await fetch('https://andrewsheating.com/about-us/', {headers:{'user-agent':'ArborLineResearch/1.0'}})).text();
          const decodeHtml = value => value.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>');
          const text = decodeHtml(html.replace(/<!--[\s\S]*?-->/g,' ').replace(/<(script|style|noscript|svg|template)[^>]*>[\s\S]*?<\/\1>/gi,' ').replace(/<(br|\/p|\/div|\/li|\/h[1-6]|\/tr)>/gi,'\n').replace(/<[^>]+>/g,' ')).replace(/\r/g,'').replace(/[\t ]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
          const lines = text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
          console.log('LINES WITH TITLE/FAMILY CONTEXT');
          for (const line of lines.filter(x=>/Doug|Dennis|Nathan|President|CEO|owner/i.test(x))) console.log(JSON.stringify(line));
          const line = lines.find(x=>/President/i.test(x)) || '';
          const role='President';
          const pattern = new RegExp(`(?:^|[.!?]\\s+)(?:In\\s+\\d{4}\\s+)?([A-Z][A-Za-z'’.-]{1,30})\\s+(?:became|is|serves\\s+as|was\\s+named|was\\s+appointed|was\\s+promoted\\s+to)\\s+(?:the\\s+)?${role}\\b`, 'gi');
          console.log('PRESIDENT LINE', JSON.stringify(line));
          console.log('PRESIDENT MATCHES', [...line.matchAll(pattern)].map(m=>({full:m[0],given:m[1],index:m.index})));
          const fullNames=[...text.matchAll(/\b([A-Z][A-Za-z'’.-]{1,30})\s+([A-Z][A-Za-z'’.-]{1,40})\b/g)].map(m=>m[0]);
          console.log('ANDREWS FULL NAMES', fullNames.filter(x=>/Andrews/i.test(x)));
          for (const full of fullNames.filter(x=>/Andrews/i.test(x))) {
            const [first,last]=full.split(/\s+/);
            const childOfGiven=new RegExp(`${full}[^.!?]{0,60}Doug[’']s\\s+(?:son|daughter)`,'i');
            const givenChildOfNamedParent=new RegExp(`Doug[^.!?]{0,80}${first}[’']s\\s+(?:son|daughter)`,'i');
            console.log('FAMILY', full, {childOfGiven:childOfGiven.test(text),givenChildOfNamedParent:givenChildOfNamedParent.test(text)});
          }
          NODE
