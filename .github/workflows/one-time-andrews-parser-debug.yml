name: Debug Andrews narrative parser

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-andrews-parser-debug.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instrument actual crawler candidate path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/connect-public-research.ts')
          s = p.read_text()
          old = '''    if (narrativeEligiblePage) {
      for (const approvedTitle of approvedTitles) {
        const role = escapeRegex(approvedTitle);
        const statementPattern = new RegExp(`(?:^|[.!?]\\\\s+)(?:In\\\\s+\\\\d{4}\\\\s+)?([A-Z][A-Za-z'’.-]{1,30})\\\\s+(?:became|is|serves\\\\s+as|was\\\\s+named|was\\\\s+appointed|was\\\\s+promoted\\\\s+to)\\\\s+(?:the\\\\s+)?${role}\\\\b`, "gi");
        for (const statement of page.text.matchAll(statementPattern)) {
          const givenName = statement[1];
          if (!givenName) continue;
          const resolved = resolveGivenNameFromFamilyContext(givenName, page.text);
          if (!resolved || !looksLikePersonName(resolved.name)) continue;'''
          new = '''    if (narrativeEligiblePage) {
      if (domain === "andrewsheating.com") {
        const dougIndex = page.text.indexOf("Doug");
        console.log("ANDREWS_PAGE_DEBUG", JSON.stringify({ url: page.url, path, narrativeEligiblePage, textLength: page.text.length, dougIndex, dougContext: dougIndex >= 0 ? page.text.slice(Math.max(0, dougIndex - 220), Math.min(page.text.length, dougIndex + 900)) : null, titles: approvedTitles }));
      }
      for (const approvedTitle of approvedTitles) {
        const role = escapeRegex(approvedTitle);
        const statementPattern = new RegExp(`(?:^|[.!?]\\\\s+)(?:In\\\\s+\\\\d{4}\\\\s+)?([A-Z][A-Za-z'’.-]{1,30})\\\\s+(?:became|is|serves\\\\s+as|was\\\\s+named|was\\\\s+appointed|was\\\\s+promoted\\\\s+to)\\\\s+(?:the\\\\s+)?${role}\\\\b`, "gi");
        const narrativeStatements = [...page.text.matchAll(statementPattern)];
        if (domain === "andrewsheating.com" && /^(?:President|CEO)$/i.test(approvedTitle)) {
          console.log("ANDREWS_TITLE_DEBUG", JSON.stringify({ url: page.url, approvedTitle, matchCount: narrativeStatements.length, matches: narrativeStatements.map((m) => ({ text: m[0], givenName: m[1], index: m.index })) }));
        }
        for (const statement of narrativeStatements) {
          const givenName = statement[1];
          if (!givenName) continue;
          const resolved = resolveGivenNameFromFamilyContext(givenName, page.text);
          if (domain === "andrewsheating.com" && /^(?:President|CEO)$/i.test(approvedTitle)) {
            console.log("ANDREWS_RESOLVE_DEBUG", JSON.stringify({ approvedTitle, givenName, resolved, looksPerson: resolved ? looksLikePersonName(resolved.name) : false }));
          }
          if (!resolved || !looksLikePersonName(resolved.name)) continue;'''
          if old not in s:
              raise SystemExit('instrumentation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cat > .andrews-debug.ts <<'TS'
          import { researchPublicCompanySite } from "./lib/connect-public-research";
          const titles = ["Owner","President","CEO","Founder","General Manager","Managing Partner","COO","Chief Operating Officer","VP Sales","Vice President of Sales","Sales Director","Sales Manager","Director of Business Development","Business Development Manager","Director of Operations"];
          const result = await researchPublicCompanySite("andrewsheating.com", titles, "hvac", ["HVAC","Heating & Air Conditioning","Mechanical Services","Commercial HVAC"], {
            expanded: true,
            includePublicProfiles: true,
            targetCity: "Clinton",
            targetState: "Indiana",
            employeeCount: 10,
            locationCount: null,
            deadlineMs: 100000
          });
          console.log("ANDREWS_RESULT", JSON.stringify({status: result.status, candidate: result.candidate, pagesChecked: result.pagesChecked, diagnostics: result.diagnostics}, null, 2));
          TS
          npx --yes tsx@4.20.6 .andrews-debug.ts
