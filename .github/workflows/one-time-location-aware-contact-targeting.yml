name: One-time location-aware contact targeting upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-location-aware-contact-targeting.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        id: patch
        continue-on-error: true
        run: |
          set +e
          python scripts/patch-location-aware-contact-targeting.py > /tmp/targeting-patch.log 2>&1
          status=$?
          cat /tmp/targeting-patch.log
          exit "$status"
      - name: Persist patch diagnostic on failure
        if: steps.patch.outcome == 'failure'
        run: |
          set -euo pipefail
          cp /tmp/targeting-patch.log /tmp/targeting-patch-error.txt
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp /tmp/targeting-patch-error.txt scripts/patch-location-aware-contact-targeting.error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch-location-aware-contact-targeting.error.txt
          git commit -m "Record contact targeting patch failure"
          git push origin HEAD:main
          exit 1
      - name: Validate
        if: steps.patch.outcome == 'success'
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit
        if: steps.patch.outcome == 'success'
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-location-aware-contact-targeting.yml
          rm -f scripts/patch-location-aware-contact-targeting.error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/connect-public-research.ts lib/connect-national-worker-fleet.ts lib/connect-outreach-drafts.ts scripts/patch-location-aware-contact-targeting.py scripts/patch-location-aware-contact-targeting.error.txt .github/workflows/one-time-location-aware-contact-targeting.yml
          git commit -m "Prioritize relevant local decision makers"
          git pull --rebase origin main
          git push origin HEAD:main
