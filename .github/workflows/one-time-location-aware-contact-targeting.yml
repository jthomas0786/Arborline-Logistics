name: One-time location-aware contact targeting upgrade

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-location-aware-contact-targeting.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python scripts/patch-location-aware-contact-targeting.py
      - name: Validate
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-location-aware-contact-targeting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/connect-public-research.ts lib/connect-national-worker-fleet.ts lib/connect-outreach-drafts.ts scripts/patch-location-aware-contact-targeting.py .github/workflows/one-time-location-aware-contact-targeting.yml
          git commit -m "Prioritize relevant local decision makers"
          git pull --rebase origin main
          git push origin HEAD:main
