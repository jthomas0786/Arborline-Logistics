name: One-time Connect route memory integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-connect-route-memory.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded crawler patch
        run: python .github/scripts/patch_connect_route_memory.py
      - name: Preserve strict public-email binding gates
        run: |
          grep -q 'STRUCTURED_PERSON' lib/connect-public-research.ts
          grep -q 'MAILTO_PERSON_ANCHOR' lib/connect-public-research.ts
          grep -q 'strictPublishedObservationForName' lib/connect-public-research.ts
          grep -q 'GENERIC_EMAIL_LOCAL_PARTS' lib/connect-public-research.ts
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated integration
        run: |
          if git diff --quiet -- lib/connect-public-research.ts; then
            echo "No crawler integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-public-research.ts
          git commit -m "Use persistent adaptive crawler route memory"
          git push origin HEAD:main
