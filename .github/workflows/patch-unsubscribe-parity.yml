name: Patch Unsubscribe Parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-unsubscribe-parity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply unsubscribe parity patch
        run: python scripts/patch_unsubscribe_parity.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/connect-outreach-send.ts app/api/public/connect-unsubscribe/[token]/route.ts app/campaigns/actions.ts
          git diff --cached --check
          git commit -m "Unify unsubscribe signing and manual outreach safety"
          git push
