name: One-time targeting scoring consistency

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-targeting-scoring-consistency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply scoring consistency patch
        run: python scripts/finish-location-aware-contact-targeting.py
      - name: Validate
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit verified scoring alignment
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-targeting-scoring-consistency.yml
          rm -f scripts/finish-location-aware-contact-targeting.py
          rm -f scripts/patch-location-aware-contact-targeting.py
          rm -f scripts/fix-location-aware-contact-targeting-patcher.py
          rm -f scripts/patch-location-aware-contact-targeting.error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/connect-prospect-scoring.ts scripts .github/workflows/one-time-targeting-scoring-consistency.yml
          git commit -m "Align qualification with local contact targeting"
          git pull --rebase origin main
          git push origin HEAD:main
